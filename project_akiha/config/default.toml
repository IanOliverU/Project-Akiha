[pet_window]
width = 180
height = 220
frames_per_second = 30
start_x = 120
start_y = 120
always_on_top = true
animation_manifest_path = "assets/animations/manifest.toml"
walking_speed_pixels = 2

[ai]
provider = "mock"
ollama_base_url = "http://localhost:11434"
ollama_model = "llama3.2"
hosted_base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
hosted_model = "gemini-3.6-flash"
request_timeout_seconds = 60
assistant_tools_enabled = false

[personality]
character_name = "Akiha"
system_prompt = "You are {character_name}, a warm, concise desktop companion. Be helpful, friendly, and direct. Keep replies grounded in what the user asked for, and do not claim abilities the app has not built yet."

[memory]
enabled = true
retrieval_limit = 5
require_approval = false

[privacy]
notice_version_acknowledged = 0
hosted_live_notice_version_acknowledged = 0

[behavior]
enabled = true
proactive_enabled = false
idle_after_seconds = 300
away_after_seconds = 900
minimum_seconds_between_notifications = 1800
allow_notifications_while_away = false
scheduled_check_ins_enabled = false
scheduled_check_in_interval_seconds = 3600
quiet_hours_enabled = false
quiet_hours_start = "22:00"
quiet_hours_end = "07:00"

[voice]
enabled = false
push_to_talk_enabled = true
input_provider = "faster-whisper"
input_model = "small"
input_language = "auto"
input_device = ""
output_provider = "gpt-sovits"
output_base_url = "http://127.0.0.1:9880"
output_voice_id = "akiha"
output_reference_dir = "AKIHA VOICE"
output_prompt_text = ""
output_device = ""
output_engine_auto_start = false
output_engine_stop_on_exit = true
automatic_speech_enabled = false
proactive_speech_enabled = false
english_subtitles_enabled = false
export_english_subtitles_enabled = false
live_transcription_enabled = false
auto_stop_on_silence_enabled = false
auto_send_transcript_enabled = false
silence_timeout_seconds = 1.2
volume_percent = 100
speaking_rate = 1.0
capture_timeout_seconds = 30
request_timeout_seconds = 30
local_conversation_idle_timeout_seconds = 120
local_conversation_max_duration_seconds = 1800
session_provider = "local_modular"
hosted_live_model = "gemini-3.1-flash-live-preview"
hosted_live_voice_name = "Kore"
hosted_live_max_duration_seconds = 600

[spotify]
enabled = false
client_id = ""
redirect_uri = "http://127.0.0.1:43821/callback"
auto_launch_desktop_app = true
request_timeout_seconds = 15

[integrations]
visual_notifications_enabled = true
voice_notifications_enabled = true
event_expiry_seconds = 300
receipt_retention_days = 90

[integrations.gmail]
enabled = false
client_id = ""
redirect_uri = "http://127.0.0.1:43822/callback"
poll_interval_seconds = 60
request_timeout_seconds = 15
notify_new_messages = true
notify_important = true
notify_interview = true
notify_recruiter = true
notify_work = true
notify_personal = false
notify_newsletter = false
notify_promotional = false

[integrations.discord]
enabled = false
mode = "bot_gateway"
notify_bot_direct_messages = true
notify_mentions = true
notify_authorized_channels = false
authorized_channel_ids = []
reconnect_max_seconds = 60
