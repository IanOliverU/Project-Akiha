[pet_window]
width = 180
height = 220
frames_per_second = 24
start_x = 120
start_y = 120
always_on_top = true
animation_manifest_path = "assets/animations/manifest.toml"
walking_speed_pixels = 2

[ai]
provider = "mock"
ollama_base_url = "http://localhost:11434"
ollama_model = "llama3.2"
hosted_base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
hosted_model = "gemini-3.6-flash"
request_timeout_seconds = 60

[personality]
character_name = "Akiha"
system_prompt = "You are {character_name}, a warm, concise desktop companion. Be helpful, friendly, and direct. Keep replies grounded in what the user asked for, and do not claim abilities the app has not built yet."

[memory]
enabled = true
retrieval_limit = 5
require_approval = false

[behavior]
enabled = true
proactive_enabled = false
idle_after_seconds = 300
away_after_seconds = 900
minimum_seconds_between_notifications = 1800
allow_notifications_while_away = false
scheduled_check_ins_enabled = false
scheduled_check_in_interval_seconds = 3600
quiet_hours_enabled = false
quiet_hours_start = "22:00"
quiet_hours_end = "07:00"

[voice]
enabled = false
push_to_talk_enabled = true
input_provider = "faster-whisper"
input_model = "small"
input_language = "auto"
input_device = ""
output_provider = "voicevox"
output_base_url = "http://127.0.0.1:50021"
output_voice_id = "0"
output_device = ""
automatic_speech_enabled = false
proactive_speech_enabled = false
english_subtitles_enabled = false
export_english_subtitles_enabled = false
live_transcription_enabled = false
auto_stop_on_silence_enabled = false
auto_send_transcript_enabled = false
silence_timeout_seconds = 1.2
volume_percent = 100
speaking_rate = 1.0
capture_timeout_seconds = 30
request_timeout_seconds = 30
